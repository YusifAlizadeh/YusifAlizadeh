<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="root@alizadah — penetration tester, red team, osint">

  <title>root@alizadah — penetration tester · red team · osint</title>

  <defs>
    <!-- window clip so the title bar keeps the rounded top corners -->
    <clipPath id="win">
      <rect x="1" y="1" width="898" height="288" rx="10"/>
    </clipPath>

    <!-- scanline overlay -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="2" fill="#000000" opacity="0.10"/>
    </pattern>

    <!-- faint green glow from the top edge -->
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff9c" stop-opacity="0.07"/>
      <stop offset="60%"  stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>

    <!-- ── typing clips. every animation shares dur=9s so the cycle stays in sync ── -->
    <clipPath id="t1">
      <rect x="0" y="40" width="0" height="26">
        <animate attributeName="width" values="0;0;250;250;0;0"
                 keyTimes="0;0.033;0.133;0.930;0.950;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t2">
      <rect x="0" y="66" width="0" height="26">
        <animate attributeName="width" values="0;0;220;220;0;0"
                 keyTimes="0;0.144;0.267;0.930;0.950;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t3">
      <rect x="0" y="210" width="0" height="26">
        <animate attributeName="width" values="0;0;250;250;0;0"
                 keyTimes="0;0.400;0.511;0.930;0.950;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t4">
      <rect x="0" y="236" width="0" height="26">
        <animate attributeName="width" values="0;0;130;130;0;0"
                 keyTimes="0;0.522;0.589;0.930;0.950;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#win)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">

    <!-- window body -->
    <rect x="0" y="0" width="900" height="290" fill="#0a0c10"/>
    <rect x="0" y="0" width="900" height="140" fill="url(#glow)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="32" fill="#0d1117"/>
    <line x1="0" y1="32" x2="900" y2="32" stroke="#00ff9c" stroke-opacity="0.18"/>
    <circle cx="22" cy="16" r="5.5" fill="#ff5f56"/>
    <circle cx="42" cy="16" r="5.5" fill="#ffbd2e"/>
    <circle cx="62" cy="16" r="5.5" fill="#27c93f"/>
    <text x="450" y="21" text-anchor="middle" font-size="12" fill="#6e7681">root@alizadah: ~ — zsh</text>

    <!-- ── atmosphere: dim hex dump on the right ── -->
    <g font-size="11" fill="#00ff9c" opacity="0.16">
      <text x="648" y="118">0x7ffd  48 89 e5 41 57 41 56</text>
      <text x="648" y="134">0x7fe5  2f 62 69 6e 2f 73 68</text>
      <text x="648" y="150">0x7fcb  90 90 90 90 eb 1f 5e</text>
      <text x="648" y="166">0x7fb2  31 c0 b0 0b 89 f3 cd</text>
      <text x="648" y="182">0x7f9a  80 e8 dc ff ff ff 00</text>
      <animate attributeName="opacity" values="0.16;0.26;0.16" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- ── line 1 ── -->
    <g clip-path="url(#t1)" font-size="16">
      <text x="24" y="58" fill="#00ff9c">┌──(root㉿alizadah)-[~]</text>
    </g>

    <!-- ── line 2 ── -->
    <g clip-path="url(#t2)" font-size="16">
      <text x="24" y="84"><tspan fill="#00ff9c">└─$ </tspan><tspan fill="#c9d1d9">whoami --verbose</tspan></text>
    </g>

    <!-- ── identity card ── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0"
               keyTimes="0;0.289;0.356;0.930;0.950;1" dur="9s" repeatCount="indefinite"/>
      <rect x="40" y="102" width="572" height="88" rx="4" fill="#0d1117"
            stroke="#00ff9c" stroke-opacity="0.35"/>
      <rect x="40" y="102" width="3" height="88" fill="#00ff9c" fill-opacity="0.8"/>
      <text x="64" y="134" font-size="25" font-weight="700" fill="#00ff9c" letter-spacing="3">YUSIF ALIZADEH</text>
      <text x="65" y="158" font-size="13.5" fill="#c9d1d9" letter-spacing="1.2">penetration tester · red team · osint</text>
      <text x="65" y="180" font-size="12.5" letter-spacing="1">
        <tspan fill="#6e7681">loc:</tspan><tspan fill="#ffb000"> AZ</tspan><tspan fill="#6e7681">   ·   clearance:</tspan><tspan fill="#ffb000"> ETHICAL</tspan><tspan fill="#6e7681">   ·   status:</tspan><tspan fill="#ff2a4d"> ACTIVE</tspan>
      </text>
    </g>

    <!-- ── line 3 ── -->
    <g clip-path="url(#t3)" font-size="16">
      <text x="24" y="228" fill="#00ff9c">┌──(root㉿alizadah)-[~]</text>
    </g>

    <!-- ── line 4 + cursor ── -->
    <g clip-path="url(#t4)" font-size="16">
      <text x="24" y="254"><tspan fill="#00ff9c">└─$ </tspan><tspan fill="#c9d1d9">./engage</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0"
               keyTimes="0;0.589;0.600;0.930;0.950;1" dur="9s" repeatCount="indefinite"/>
      <rect x="130" y="241" width="9" height="16" fill="#00ff9c">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
                 dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- scanlines + border on top of everything -->
    <rect x="0" y="0" width="900" height="290" fill="url(#scan)"/>
    <rect x="1" y="1" width="898" height="288" rx="10" fill="none"
          stroke="#00ff9c" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>
</svg>
