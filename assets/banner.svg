<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="root@alizadah — penetration tester, red team, osint">

  <title>root@alizadah — penetration tester · red team · osint</title>

  <defs>
    <clipPath id="win">
      <rect x="1" y="1" width="898" height="288" rx="10"/>
    </clipPath>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="2" fill="#000000" opacity="0.10"/>
    </pattern>

    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d62839" stop-opacity="0.10"/>
      <stop offset="60%"  stop-color="#d62839" stop-opacity="0"/>
    </linearGradient>

    <!-- typing clips: play once, then freeze. base width = full, so renderers
         without SMIL support (and GitHub's static previews) show the finished frame -->
    <clipPath id="t1">
      <rect x="0" y="40" width="250" height="26">
        <animate attributeName="width" from="0" to="250" begin="0.3s" dur="0.9s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="t2">
      <rect x="0" y="66" width="220" height="26">
        <animate attributeName="width" from="0" to="220" begin="1.3s" dur="0.8s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="t3">
      <rect x="0" y="210" width="250" height="26">
        <animate attributeName="width" from="0" to="250" begin="3.0s" dur="0.9s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="t4">
      <rect x="0" y="236" width="152" height="26">
        <animate attributeName="width" from="0" to="152" begin="4.0s" dur="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#win)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">

    <rect x="0" y="0" width="900" height="290" fill="#0a0608"/>
    <rect x="0" y="0" width="900" height="140" fill="url(#glow)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="32" fill="#150b0e"/>
    <line x1="0" y1="32" x2="900" y2="32" stroke="#d62839" stroke-opacity="0.22"/>
    <circle cx="22" cy="16" r="5.5" fill="#ff4553"/>
    <circle cx="42" cy="16" r="5.5" fill="#a01825"/>
    <circle cx="62" cy="16" r="5.5" fill="#5c0d14"/>
    <text x="450" y="21" text-anchor="middle" font-size="12" fill="#80686c">root@alizadah: ~ — zsh</text>

    <!-- ambient hex dump -->
    <g font-size="11" fill="#d62839" opacity="0.22">
      <text x="648" y="118">0x7ffd  48 89 e5 41 57 41 56</text>
      <text x="648" y="134">0x7fe5  2f 62 69 6e 2f 73 68</text>
      <text x="648" y="150">0x7fcb  90 90 90 90 eb 1f 5e</text>
      <text x="648" y="166">0x7fb2  31 c0 b0 0b 89 f3 cd</text>
      <text x="648" y="182">0x7f9a  80 e8 dc ff ff ff 00</text>
      <animate attributeName="opacity" values="0.22;0.34;0.22" dur="4s" repeatCount="indefinite"/>
    </g>

    <g clip-path="url(#t1)" font-size="16">
      <text x="24" y="58" fill="#d62839">┌──(root㉿alizadah)-[~]</text>
    </g>

    <g clip-path="url(#t2)" font-size="16">
      <text x="24" y="84"><tspan fill="#d62839">└─$ </tspan><tspan fill="#d5c8ca">whoami --verbose</tspan></text>
    </g>

    <!-- identity card -->
    <g opacity="1">
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.5s" fill="freeze"/>
      <rect x="40" y="102" width="572" height="88" rx="4" fill="#150b0e"
            stroke="#d62839" stroke-opacity="0.40"/>
      <rect x="40" y="102" width="3" height="88" fill="#ff4553" fill-opacity="0.9"/>
      <text x="64" y="134" font-size="25" font-weight="700" fill="#ff4553" letter-spacing="3">YUSIF ALIZADEH</text>
      <text x="65" y="158" font-size="13.5" fill="#d5c8ca" letter-spacing="1.2">penetration tester · red team · osint</text>
      <text x="65" y="180" font-size="12.5" letter-spacing="1">
        <tspan fill="#80686c">loc:</tspan><tspan fill="#e09f3e"> AZ</tspan><tspan fill="#80686c">   ·   clearance:</tspan><tspan fill="#e09f3e"> ETHICAL</tspan><tspan fill="#80686c">   ·   status:</tspan><tspan fill="#ff4553"> ACTIVE</tspan>
      </text>
    </g>

    <g clip-path="url(#t3)" font-size="16">
      <text x="24" y="228" fill="#d62839">┌──(root㉿alizadah)-[~]</text>
    </g>

    <g clip-path="url(#t4)" font-size="16">
      <text x="24" y="254"><tspan fill="#d62839">└─$ </tspan><tspan fill="#d5c8ca">./engage</tspan></text>
    </g>

    <!-- cursor: appears after the last command, then blinks forever -->
    <g opacity="1">
      <animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.1s" fill="freeze"/>
      <rect x="148" y="241" width="9" height="16" fill="#ff4553">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
                 dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0" y="0" width="900" height="290" fill="url(#scan)"/>
    <rect x="1" y="1" width="898" height="288" rx="10" fill="none"
          stroke="#d62839" stroke-opacity="0.32" stroke-width="1.5"/>
  </g>
</svg>
